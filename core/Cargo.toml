[package]
name = "app-core"
version = "0.1.0"
edition = "2021"
description = "The app's 3D view: the ThreeRT live path tracer and the scene's script, on a CAMetalLayer, behind a C ABI"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
threert-render = { path = "../engine/renderer", default-features = false, features = ["audio"] }
wgpu = "30"
bytemuck = "1"
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
debug = false
lto = "thin"

# The engine's physics needs its patched math crates; cargo reads this table from the crate it builds.
[patch.crates-io]
glamx = { path = "../engine/renderer/third_party/glamx" }
parry3d = { path = "../engine/renderer/third_party/parry3d" }
