name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecar:
    name: sidecar and scene (tests, types, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: sidecar
      - run: bun test
        working-directory: sidecar
      - run: node_modules/.bin/tsc -p .
        working-directory: sidecar
      - run: sidecar/node_modules/.bin/tsc -p scene
      - run: bun sidecar/src/bundle.ts

  app:
    name: macOS app (core + Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: brew install xcodegen
      - id: engine
        run: echo "sha=$(git -C engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-${{ hashFiles('core/Cargo.lock') }}-${{ steps.engine.outputs.sha }}
      - run: bun tools/macos.ts
